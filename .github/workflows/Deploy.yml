
name: Build and Deploy MIND Lab

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout MIND Lab repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1'

      - name: Build Franklin website
        run: |
          julia -e '
            using Pkg;
            Pkg.activate(".");
            Pkg.instantiate();
            using NodeJS;
            run(`$(npm_cmd()) install highlight.js`);
            using Franklin;
            optimize()
          '

      - name: Deploy MIND Lab
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: __site
          token: ${{ secrets.GITHUB_TOKEN }}
